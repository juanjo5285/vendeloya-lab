# Laboratorio local de la arquitectura de LÍNEA BASE de VendeloYa.
# Reproduce a propósito las configuraciones predeterminadas (inseguras) descritas
# en la Tabla 3 del documento. NO usar en producción.

name: vendeloya-lab

x-wordpress: &wordpress
  image: wordpress:latest            # etiqueta latest, igual que la línea base
  restart: unless-stopped
  environment: &wp-env
    WORDPRESS_DB_HOST: db:3306
    WORDPRESS_DB_USER: ${DB_USER}
    WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
    WORDPRESS_DB_NAME: ${DB_NAME}
  volumes:
    - wp_html:/var/www/html          # equivale al contenido compartido entre réplicas
  networks: [app]

services:
  # --- Base de datos (equivale a Azure Database for MySQL Flexible Server 8.0) ---
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3306:3306"                  # expuesto al host: imita el "acceso público" de la línea base
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [app]

  # --- Aplicación: dos réplicas (equivale a los 2 pods en AKS) ---
  wp1:
    <<: *wordpress
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/www/html/wp-config.php"]
      interval: 5s
      timeout: 3s
      retries: 40

  wp2:
    <<: *wordpress
    depends_on:
      wp1:
        condition: service_healthy   # evita que ambas copien archivos a la vez

  # --- Ingress (equivale a Ingress NGINX en AKS), sin TLS ni WAF ---
  ingress:
    image: nginx:stable
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [wp1, wp2]
    networks: [app]

  # --- Instalación automática de WordPress, plugins y usuarios (se ejecuta una vez) ---
  wpcli:
    image: wordpress:cli
    user: "33:33"                    # mismo UID que www-data de la imagen wordpress
    environment:
      <<: *wp-env
      HOME: /tmp
      WP_CLI_CACHE_DIR: /tmp/wpcli-cache
      SITE_URL: ${SITE_URL}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      USER_PASSWORD: ${USER_PASSWORD}
    volumes:
      - wp_html:/var/www/html
      - ./wpcli/setup.sh:/setup.sh:ro
    entrypoint: ["/bin/sh", "/setup.sh"]
    depends_on:
      wp1:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: "no"
    networks: [app]

volumes:
  wp_html:
  db_data:

networks:
  app:
