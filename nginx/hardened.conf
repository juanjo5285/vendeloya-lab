# Ingress endurecido de VendeloYa.
server_tokens off;
limit_req_status 429;

# Límites de velocidad
limit_req_zone $binary_remote_addr zone=perip:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# Solo se limita el pago por AJAX de WooCommerce (clave vacía = sin límite)
map $args $checkout_key {
    default "";
    "~*wc-ajax=checkout" $binary_remote_addr;
}
limit_req_zone $checkout_key zone=checkout:10m rate=10r/m;

# Sesión iniciada (cookie de WordPress)
map $http_cookie $logged_in {
    default 0;
    "~*wordpress_logged_in_" 1;
}

upstream wordpress {
    server wp1:80;
    server wp2:80;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 64m;

    # IP real del cliente detrás de la WAF
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;

    # Parámetros del proxy (los heredan todas las rutas)
    proxy_http_version 1.1;
    # La WAF reenvía el Host sin el puerto; se fija para evitar el bucle de redirección 301 de WordPress
    proxy_set_header Host localhost:8080;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_hide_header X-Powered-By;

    # Cabeceras de seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP en modo informe: no rompe Elementor ni WooCommerce y deja ver qué se bloquearía
    add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; frame-ancestors 'self'" always;

    # Superficie pública innecesaria (H-14)
    location = /xmlrpc.php { return 403; }
    location = /wp-cron.php { return 403; }
    location ~* ^/(readme\.html|license\.txt|wp-config\.php|wp-config-sample\.php)$ { return 403; }
    location ~ /\.(?!well-known) { return 403; }
    location ~* ^/wp-content/uploads/.*\.php$ { return 403; }
    location ~* \.(sql|bak|old|orig|log)$ { return 403; }

    # Enumeración de usuarios por ?author=N
    if ($args ~* "(^|&)author=\d+") { return 403; }

    # Enumeración de usuarios por la API REST (solo con sesión iniciada)
    location ~ ^/wp-json/wp/v2/users {
        if ($logged_in = 0) { return 403; }
        proxy_pass http://wordpress;
    }

    # Inicio de sesión con límite de intentos (H-15)
    location = /wp-login.php {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://wordpress;
    }

    # Resto del sitio, con límite por IP y por pago (H-10, H-24, H-25)
    location / {
        limit_req zone=perip burst=100 nodelay;
        limit_req zone=checkout burst=5 nodelay;
        proxy_pass http://wordpress;
    }
}
