# Exclusiones locales de la WAF para VendeloYa (se montan en el contenedor "waf").
#
# Falso positivo detectado en la prueba del 4 de noviembre de 2026:
# la regla 934110 (SSRF, URL de metadatos en un parametro) bloquea con 403 el inicio de sesion
# porque el parametro redirect_to de /wp-login.php contiene "http://localhost:8080/wp-admin/".
# Se excluye SOLO ese parametro y SOLO en esa ruta; la regla sigue activa en el resto del sitio.
SecRule REQUEST_FILENAME "@streq /wp-login.php" \
    "id:1000001,phase:1,pass,nolog,\
    ctl:ruleRemoveTargetById=934110;ARGS:redirect_to"

# ---------------------------------------------------------------------------
# Falsos positivos detectados el 4 de noviembre de 2026 (checkout, carrito y publicar).
# Cada exclusion esta limitada a una ruta y a un parametro o encabezado concretos.
# Las reglas siguen activas en el resto del sitio.
# ---------------------------------------------------------------------------

# 1000002 - Checkout: 934110 (SSRF) salta porque el atributo de pedido de WooCommerce
# (json.extensions.woocommerce/order-attribution.session_entry) contiene "http://localhost:8080/".
# En un dominio real (no localhost) esta coincidencia no ocurriria.
SecRule REQUEST_FILENAME "@beginsWith /wp-json/wc/store/" \
    "id:1000002,phase:1,pass,nolog,\
    ctl:ruleRemoveTargetById=934110;ARGS:json.extensions.woocommerce/order-attribution.session_entry"

# 1000003 - Checkout: 920450 (encabezado restringido) salta por X-HTTP-Method-Override,
# que el bloque de checkout de WooCommerce envia de forma legitima.
SecRule REQUEST_FILENAME "@beginsWith /wp-json/wc/store/" \
    "id:1000003,phase:1,pass,nolog,\
    ctl:ruleRemoveById=920450"

# 1000004 - Carrito: 932120 (comandos PowerShell) salta porque la ruta interna de la API,
# /wc/store/v1/cart/remove-item, contiene el texto "Remove-Item". Se desactiva solo en el
# endpoint de lotes de la Store API.
SecRule REQUEST_FILENAME "@streq /wp-json/wc/store/v1/batch" \
    "id:1000004,phase:1,pass,nolog,\
    ctl:ruleRemoveById=932120"

# 1000005 - Publicar en wp-admin: 934110 salta por el campo oculto _wp_original_http_referer,
# que contiene la URL local del listado de productos.
SecRule REQUEST_FILENAME "@streq /wp-admin/post.php" \
    "id:1000005,phase:1,pass,nolog,\
    ctl:ruleRemoveTargetById=934110;ARGS:_wp_original_http_referer"

# 1000006 - Guardar cupones en wp-admin: 934110 salta por el campo oculto referredby,
# que contiene la URL local del listado de cupones. Mismo caso que 1000005, otro campo.
SecRule REQUEST_FILENAME "@streq /wp-admin/post.php" \
    "id:1000006,phase:1,pass,nolog,\
    ctl:ruleRemoveTargetById=934110;ARGS:referredby"

# 1000007 - Guardar/publicar en el editor de bloques: Gutenberg envía por la API REST
# el encabezado X-HTTP-Method-Override: PUT (regla 920450 lo restringe). Se excluye solo
# en la API REST de contenido de WordPress, no en todo el sitio.
SecRule REQUEST_FILENAME "@beginsWith /wp-json/wp/v2/" \
    "id:1000007,phase:1,pass,nolog,\
    ctl:ruleRemoveById=920450"
