# Laboratorio ENDURECIDO de VendeloYa.
# Usa el mismo nombre de proyecto y los mismos volúmenes que la línea base, así que conserva
# la base de datos y los archivos del sitio. Cambia solo la configuración de red y contenedores.
#
#   Activar : docker compose -f docker-compose.hardened.yml up -d --remove-orphans
#   Volver  : docker compose -f docker-compose.yml up -d --remove-orphans

name: vendeloya-lab

x-wordpress: &wordpress
  image: wordpress:latest
  restart: unless-stopped
  environment:
    WORDPRESS_DB_HOST: db:3306
    WORDPRESS_DB_USER: ${DB_USER}
    WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
    WORDPRESS_DB_NAME: ${DB_NAME}
  volumes:
    - wp_html:/var/www/html
    - ./php/hardening.ini:/usr/local/etc/php/conf.d/zz-hardening.ini:ro
    - ./apache/hardening.conf:/etc/apache2/conf-enabled/zz-hardening.conf:ro
  networks: [frontend, backend]
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, KILL, SETGID, SETUID, NET_BIND_SERVICE]
  read_only: true
  tmpfs:
    - /tmp
    - /var/run/apache2
    - /var/lock/apache2
  mem_limit: 1g
  cpus: 1.5
  pids_limit: 300

services:
  # Base de datos: sin puerto publicado y solo en la red interna "backend"
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [backend]
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 300

  wp1:
    <<: *wordpress
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/www/html/wp-config.php"]
      interval: 5s
      timeout: 3s
      retries: 40

  wp2:
    <<: *wordpress
    depends_on:
      wp1:
        condition: service_healthy

  # Ingress endurecido: sin puerto publicado, solo lo alcanza la WAF
  ingress:
    image: nginx:stable
    restart: unless-stopped
    volumes:
      - ./nginx/hardened.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [wp1, wp2]
    networks: [frontend]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 200

  # WAF: ModSecurity + OWASP Core Rule Set. Hace de "CDN simulado" y publica HTTP y HTTPS.
  waf:
    image: owasp/modsecurity-crs:nginx
    restart: unless-stopped
    environment:
      PROXY: "1"
      BACKEND: http://ingress:80
      PORT: "8080"
      SSL_PORT: "8443"
      PARANOIA: "1"
      ANOMALY_INBOUND: "5"
      ANOMALY_OUTBOUND: "4"
      MODSEC_RULE_ENGINE: "On"        # usar DetectionOnly para observar sin bloquear
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./waf/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:/etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:ro
    depends_on: [ingress]
    networks: [frontend]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 200

  # Aplica o revierte los ajustes de wp-config.php (se ejecuta a demanda)
  hardener:
    image: wordpress:cli
    user: "33:33"
    profiles: ["tools"]
    environment:
      HOME: /tmp
    volumes:
      - wp_html:/var/www/html
      - ./wpcli/harden.sh:/harden.sh:ro
      - ./wpcli/unharden.sh:/unharden.sh:ro
    entrypoint: ["/bin/sh"]
    network_mode: none

volumes:
  wp_html:
  db_data:

networks:
  frontend:
  backend:
    internal: true
